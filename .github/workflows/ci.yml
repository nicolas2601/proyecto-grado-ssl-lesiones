name: CI

# The suite only ever ran when someone remembered to type pytest. These jobs
# encode the three failures this repo actually had: tests hidden behind a
# missing optional dependency, generated notebooks drifting from their builder,
# and documentation numbers typed by hand.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

  tests:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # CI_REQUIRE_FULL_DEPS turns "module skipped, no scikit-learn" into a
      # failure. Without it a bare pytest hides tests/test_probes.py and
      # tests/test_notebook_metrics_binary.py - the binary-AUC fix among them -
      # and still reports green.
      - name: Run the suite with every optional dependency present
        env:
          CI_REQUIRE_FULL_DEPS: "1"
        run: pytest -q -rs --strict-markers

      - name: Fail if any test was skipped for a missing dependency
        env:
          CI_REQUIRE_FULL_DEPS: "1"
        run: |
          pytest -q -rs --strict-markers 2>&1 | tee /tmp/pytest.log
          if grep -qi "could not import" /tmp/pytest.log; then
            echo "::error::a test module was skipped for a missing import"
            grep -i "could not import" /tmp/pytest.log
            exit 1
          fi

  generated:
    name: generated files are fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Both builders, always. The finetune builder reuses the baseline
      # backbone cell, so fixing the baseline one and regenerating only its own
      # notebooks leaves the sixteen finetune notebooks carrying the old bug -
      # exactly what happened with the vgg19 extraction point on 2026-09-03.
      - name: Regenerate the Kaggle notebooks
        run: |
          python scripts/build_baseline_tests.py
          python scripts/build_finetune_tests.py

      - name: Fail if the committed notebooks drift from their builder
        run: |
          if ! git diff --exit-code -- notebooks/; then
            echo "::error::notebooks differ from their builder - run both build_*_tests.py and commit"
            exit 1
          fi

      # The published result and checkpoint tables are generated from
      # results/*.json and protocol.TIMM_HF_TAGS. tests/test_readme_tables_fresh.py
      # compares published against generated; this makes that failure explicit.
      - name: Fail if the published tables drift from the data
        run: pytest -q tests/test_readme_tables_fresh.py -rs
