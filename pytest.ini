# Registered so --strict-markers does not turn a typo into a silent skip.
#
# `torch` guards the modules that need the real library. Until CI installed
# it, those five files were never collected at all; once it did, the marker
# was unregistered and --strict-markers failed collection - which is the
# check working, on a gap nobody had reached before.
[pytest]
# Nothing here should take a minute; anything that does is hung, not slow.
timeout = 120
# signal, not thread: a blocking network read inside a C extension ignores
# the thread method entirely, which is how a 120 s deadline still produced a
# thirty-five minute step. SIGALRM interrupts it.
timeout_method = signal
markers =
    torch: needs a real torch installation, not the import-time stubs
