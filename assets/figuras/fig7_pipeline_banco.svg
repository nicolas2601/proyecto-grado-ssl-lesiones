xt x='900.0' y='249.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>1 vector por imagen</text><text x='900.0' y='269.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>extraccion unica</text><rect x='1090' y='100' width='220' height='100' rx='8' fill='#FCE4D6' stroke='#ED7D31' stroke-width='1.5'/><text x='1200.0' y='134.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>Probe kNN</text><text x='1200.0' y='154.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>coseno + L2-norm</text><text x='1200.0' y='174.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>k=20, cero entrenamiento</text><rect x='1090' y='220' width='220' height='100' rx='8' fill='#FCE4D6' stroke='#ED7D31' stroke-width='1.5'/><text x='1200.0' y='254.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>Probe linear</text><text x='1200.0' y='274.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>regresion logistica</text><text x='1200.0' y='294.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>1 capa, class_weight</text><rect x='1090' y='340' width='220' height='100' rx='8' fill='#FCE4D6' stroke='#ED7D31' stroke-width='1.5'/><text x='1200.0' y='374.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>Probe prototipos</text><text x='1200.0' y='394.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>centroide por clase</text>