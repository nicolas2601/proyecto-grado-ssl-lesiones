<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='780' viewBox='0 0 1500 780'><rect width='1500' height='780' fill='white'/><defs><marker id='arr' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'>
<path d='M0,0 L10,4 L0,8 z' fill='#555'/></marker></defs><text x='750.0' y='38' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='24' font-weight='bold' fill='#1F4E79'>Banco de pruebas — pipeline completo (v5)</text><text x='750.0' y='62' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='15' fill='#555'>7 modelos congelados, protocolo identico. Solo cambia el backbone; todo lo demas es fijo.</text><rect x='40' y='110' width='250' height='170' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='165.0' y='149.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='bold' fill='#222'>HAM10000</text><text x='165.0' y='169.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>(nuestro dataset)</text><text x='165.0' y='189.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>10,015 imagenes - 7 clases</text><text x='165.0' y='209.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>split por lesion_id</text><text x='165.0' y='229.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>0 lesiones compartidas</text><text x='165.0' y='249.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>train / val</text><rect x='380' y='100' width='330' height='150' rx='8' fill='#D9E2F3' stroke='#8EAADB' stroke-width='1.5'/><text x='545.0' y='124.84' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>SUPERVISADOS (comparadores)</text><text x='545.0' y='146.84' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#22