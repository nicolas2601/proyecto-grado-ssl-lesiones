r)'/><line x1='1315' y1='150' x2='1420' y2='475' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><line x1='1315' y1='270' x2='1405' y2='475' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><line x1='1315' y1='390' x2='1390' y2='475' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><rect x='40' y='480' width='640' height='150' rx='8' fill='#E2EFDA' stroke='#70AD47' stroke-width='1.5'/><text x='360.0' y='521.72' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='bold' fill='#222'>NUESTRO MODELO (proposal - FULL SSL, cero etiquetas)</text><text x='360.0' y='547.72' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>v6: DINOv2 continual sobre pool de piel  +  SimSiam desde cero</text><text x='360.0' y='573.72' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>entra a la MISMA tabla, con el MISMO protocolo</text><text x='360.0' y='599.72' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>asi sabemos si gana o pierde contra los 7</text><line x1='680' y1='530' x2='850' y2='295' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><text x='765.0' y='404.5' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' fill='#555'>mismo pipeline</text></svg>