<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='640' viewBox='0 0 1500 640'><rect width='1500' height='640' fill='white'/><defs><marker id='arr' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'>
<path d='M0,0 L10,4 L0,8 z' fill='#555'/></marker></defs><text x='750.0' y='38' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='24' font-weight='bold' fill='#1F4E79'>Test de baseline vs Proposal</text><text x='750.0' y='62' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='15' fill='#555'>Arriba: como se testea cada modelo de la tabla. Abajo: nuestro proposal (full SSL).</text><text x='60' y='120' font-family='Liberation Sans, Arial, sans-serif' font-size='17' font-weight='bold' fill='#1F4E79'>BASELINE (por cada modelo de la tabla)</text><rect x='60' y='140' width='240' height='90' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='180.0' y='169.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='bold' fill='#222'>1. Input</text><text x='180.0' y='189.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>HAM10000 / ISIC</text><text x='180.0' y='209.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>(con o sin etiquetas)</text><rect x='400' y='140' width='330' height='90' rx='8' fill='#D9E2F3' stroke='#8EAADB' stroke-width='1.5'/><text x='565.0' y='169.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>2. Classifier (congelado)</text><text x='565.0' y='189.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>AlexNet, VGG19, EfficientNet, ResNet-50,</text><text x='565.0' y='209.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>ViT-B/16, SimSiam, DINOv2 + checkpoint</text><rect x='830' y='140' width='200' height='90' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='930.0' y='169.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='bold' fill='#222'>3. Output</text><text x='930.0' y='189.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>prediccion (label)</text><text x='930.0' y='209.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>7 clases</text><rect x='1130' y='120' width='320' height='130' rx='8' fill='#FCE4D6' stroke='#ED7D31' stroke-width='1.5'/><text x='1290.0' y='159.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>Metricas (literatura)</text><text x='1290.0' y='179.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>Accuracy - Balanced Acc - F1</text><text x='1290.0' y='199.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>Precision - Recall - AUC - ECE</text><text x='1290.0' y='219.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>por probe: kNN / linear / prototipos</text><line x1='300' y1='185' x2='395' y2='185' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><line x1='730' y1='185' x2='825' y2='185' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><text x='777.5' y='177.0' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' fill='#555'>features + probes</text><line x1='1030' y1='185' x2='1125' y2='185' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><line x1='40' y1='290' x2='1460' y2='290' stroke='#CCC' stroke-dasharray='6,4'/><text x='60' y='330' font-family='Liberation Sans, Arial, sans-serif' font-size='17' font-weight='bold' fill='#548235'>PROPOSAL (nuestro modelo - FULL SSL, nada supervisado)</text><rect x='60' y='350' width='240' height='100' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='180.0' y='374.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>1. Input</text><text x='180.0' y='394.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>pool dermatoscopico</text><text x='180.0' y='414.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>~48-70k imagenes</text><text x='180.0' y='434.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>SIN etiquetas</text><rect x='380' y='350' width='300' height='100' rx='8' fill='#E2EFDA' stroke='#70AD47' stroke-width='1.5'/><text x='530.0' y='374.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>2. Transformation</text><text x='530.0' y='394.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>Skin Tone (Fitzpatrick)</text><text x='530.0' y='414.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>constancia de color +</text><text x='530.0' y='434.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>multi-crop guiado por lesion</text><rect x='760' y='350' width='300' height='100' rx='8' fill='#E2EFDA' stroke='#70AD47' stroke-width='1.5'/><text x='910.0' y='374.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>3. Classifier SSL</text><text x='910.0' y='394.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>brazo A: DINOv2 continual</text><text x='910.0' y='414.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>brazo B: SimSiam desde cero</text><text x='910.0' y='434.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>assert_label_free (garantia)</text><rect x='1140' y='350' width='200' height='100' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='1240.0' y='374.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>4. Output</text><text x='1240.0' y='394.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>prediccion (label)</text><text x='1240.0' y='414.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>via los mismos</text><text x='1240.0' y='434.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>3 probes</text><line x1='300' y1='400' x2='375' y2='400' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><line x1='680' y1='400' x2='755' y2='400' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><line x1='1060' y1='400' x2='1135' y2='400' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><rect x='60' y='500' width='1280' height='90' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='700.0' y='537.16' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>Las etiquetas se usan UNICAMENTE en la evaluacion (probes y metricas) - nunca en el pre-entrenamiento del proposal.</text><text x='700.0' y='565.16' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>Baselines supervisados = solo comparadores congelados. La hipotesis: ver piel sin etiquetas produce mejores features.</text></svg>