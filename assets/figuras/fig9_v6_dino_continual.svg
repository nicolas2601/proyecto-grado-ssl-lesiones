<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='720' viewBox='0 0 1500 720'><rect width='1500' height='720' fill='white'/><defs><marker id='arr' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'>
<path d='M0,0 L10,4 L0,8 z' fill='#555'/></marker></defs><text x='750.0' y='38' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='24' font-weight='bold' fill='#1F4E79'>v6 - Brazo principal: DINO continual (estudiante / profesor)</text><text x='750.0' y='62' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='15' fill='#555'>Parte de DINOv2 ViT-S/14 publico y continua el aprendizaje sobre piel. 100% sin etiquetas.</text><rect x='40' y='130' width='230' height='120' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='155.0' y='164.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>Imagen del pool</text><text x='155.0' y='184.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>2 crops globales 224x224</text><text x='155.0' y='204.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>6 crops locales 98x98</text><text x='155.0' y='224.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>(sesgados al borde de lesion)</text><rect x='360' y='110' width='420' height='100' rx='8' fill='#E2EFDA' stroke='#70AD47' stroke-width='1.5'/><text x='570.0' y='144.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='bold' fill='#222'>ESTUDIANTE (recibe gradientes)</text><text x='570.0' y='164.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>Backbone DINOv2 ViT-S/14 (embed 384)</text><text x='570.0' y='184.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>ve TODOS los crops (globales + locales)</text><rect x='360' y='300' width='420' height='100' rx='8' fill=