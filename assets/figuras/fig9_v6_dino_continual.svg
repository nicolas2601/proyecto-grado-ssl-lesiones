' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>Loss DINO</text><text x='1350.0' y='239.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>cross-entropy entre</text><text x='1350.0' y='259.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>profesor (sharpened)</text><text x='1350.0' y='279.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>y estudiante</text><text x='1350.0' y='299.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>nunca vista vs si misma</text><line x1='270' y1='170' x2='355' y2='160' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><text x='312.5' y='157.0' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' fill='#555'>todos los crops</text><line x1='270' y1='210' x2='355' y2='340' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><text x='312.5' y='267.0' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' fill='#555'>solo globales</text><line x1='780' y1='160' x2='855' y2='160' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><line x1='780' y1='350' x2='855' y2='350' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><line x1='1160' y1='160' x2='1245' y2='230' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><line x1='1160' y1='350' x2='1245' y2='290' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><line x1='1330' y1='335' x2='1330' y2='420' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><rect x='1180' y='425' width='300' height='80' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='1330.0' y='449.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>gradientes SOLO al estudiante</text><text x='1330.0' y='469.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>profesor = EMA del estudiante</text><text x='1330.0' y='489.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>(momentum programado)</text><path d='M 1180 465 C 700 560, 560 470, 565 415' stroke='#555' stroke-width='2' fill='none' marker-end='url(#arr)' stroke-dasharray='7,5'/><text x='860' y='545' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' fill='#555'>actualizacion EMA (sin backprop)</text><rect x='40' y='590' width='700' height='90' rx='8' fill='#E2EFDA' stroke='#70AD47' stroke-width='1.5'/><text x='390.0' y='627.72' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>ENTREGABLE: solo el backbone del estudiante (la cabeza se descarta)</text><text x='390.0' y='653.72' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>entra congelado a la evaluacion v5, como un baseline mas</text><rect x='800' y='590' width='660' height='90' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='1130.0' y='627.72' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>Anti-colapso (receta DINO): centering (resta centro EMA de logits del profesor)</text><text x='1130.0' y='653.72' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>+ sharpening (temperatura profesor 0.04 &lt; estudiante 0.1)</text></svg>