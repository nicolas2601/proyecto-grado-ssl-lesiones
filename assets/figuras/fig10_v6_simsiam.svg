<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='620' viewBox='0 0 1500 620'><rect width='1500' height='620' fill='white'/><defs><marker id='arr' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'>
<path d='M0,0 L10,4 L0,8 z' fill='#555'/></marker></defs><text x='750.0' y='38' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='24' font-weight='bold' fill='#1F4E79'>v6 - Brazo purista: SimSiam desde inicializacion aleatoria</text><text x='750.0' y='62' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='15' fill='#555'>Cero pesos externos: responde que logra el SSL SOLO con nuestro pool. Se espera que pierda - reportarlo es el aporte.</text><rect x='40' y='130' width='230' height='110' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='155.0' y='159.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>Imagen del pool</text><text x='155.0' y='179.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>2 vistas aumentadas</text><text x='155.0' y='199.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>(augmentation aleatoria,</text><text x='155.0' y='219.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>sin etiquetas)</text><rect x='360' y='120' width='330' height='100' rx='8' fill='#E2EFDA' stroke='#70AD47' stroke-width='1.5'/><text x='525.0' y='154.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='bold' fill='#222'>Backbone ResNet-50</text><text x='525.0' y='174.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>weights=None (aleatorio)</text><text x='525.0' y='194.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>embed 2048, fc = Identity</text><rect x='790' y='120' width='300' height='100' rx='8' fill='#E2EFDA' stroke='#70AD47' stroke-width='1.5'/><text x='940.0' y='154.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>Projector (3 capas)</text><text x='940.0' y='174.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>2048-2048-2048-2048</text><text x='940.0' y='194.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>BatchNorm + ReLU</text><rect x='1190' y='120' width='270' height='100' rx='8' fill='#E2EFDA' stroke='#70AD47' stroke-width='1.5'/><text x='1325.0' y='154.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>Predictor (2 capas)</text><text x='1325.0' y='174.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>2048-512-2048</text><text x='1325.0' y='194.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>cuello de botella</text><line x1='270' y1='175' x2='355' y2='170' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><text x='312.5' y='164.5' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' fill='#555'>vista 1 y 2</text><line x1='690' y1='170' x2='785' y2='170' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><text x='737.5' y='162.0' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' fill='#555'>h</text><line x1='1090' y1='170' x2='1185' y2='170' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><text x='1137.5' y='162.0' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' fill='#555'>z</text><rect x='360' y='300' width='730' height='100' rx='8' fill='#FCE4D6' stroke='#ED7D31' stroke-width='1.5'/><text x='725.0' y='331.28' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>Loss: similitud coseno negativa SIMETRIZADA</text><text x='725.0' y='355.28' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>p1 debe parecerse a z2 (y p2 a z1), con STOP-GRADIENT en z</text><text x='725.0' y='379.28' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>el stop-gradient es TODO el truco: evita el colapso sin pares negativos ni profesor</text><line x1='1320' y1='225' x2='1000' y2='295' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><text x='1160.0' y='252.0' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' fill='#555'>p (predicciones)</text><line x1='930' y1='225' x2='800' y2='295' stroke='#555' stroke-width='2' marker-end='url(#arr)'/><text x='865.0' y='252.0' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' fill='#555'>z.detach() - stop-grad</text><rect x='1150' y='300' width='310' height='100' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='1305.0' y='324.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='bold' fill='#222'>Detector de colapso</text><text x='1305.0' y='344.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>std del embedding L2-norm</text><text x='1305.0' y='364.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>sano = 0.022 - si cae a 0: colapso</text><text x='1305.0' y='384.4' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='13' font-weight='normal' fill='#222'>logueado a MLflow cada ventana</text><rect x='40' y='460' width='1420' height='100' rx='8' fill='#F2F2F2' stroke='#BFBFBF' stroke-width='1.5'/><text x='750.0' y='488.16' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>Comparacion contra el brazo DINO a IGUAL presupuesto de GPU-horas (no igual epocas), con checkpoints al 10 / 25 / 50 / 100%</text><text x='750.0' y='516.1600000000001' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>del presupuesto - cada checkpoint se evalua con el pipeline v5 - eso produce la curva calidad-vs-computo (novedad 1).</text><text x='750.0' y='544.1600000000001' text-anchor='middle' font-family='Liberation Sans, Arial, sans-serif' font-size='14' font-weight='normal' fill='#222'>ENTREGABLE: el backbone ResNet-50 (projector y predictor se descartan).</text></svg>