# Deliberately narrow. The repo had no linter, so a broad ruleset would arrive
# as hundreds of findings nobody reads and a red pipeline everybody learns to
# ignore. These rules only fire on things that are wrong, never on style:
# syntax errors, undefined names, broken comparisons, unused imports.
# Widen it later on purpose, not by default.

line-length = 100
target-version = "py311"

# ``cluster/runtime-snapshot-*`` holds byte-for-byte rescues of the UNABIA run
# harness, kept so a pod restart cannot erase the only copy of the code that
# launches the experiments. Its value is being identical to the original: the
# wrappers hash their own source into every run seal, so "fixing" an unused
# import here would destroy the parity that makes the copy worth having.
# Excluded for that reason, not because the findings are unimportant.
exclude = [
    "notebooks",
    "data",
    "results",
    "assets",
    "demo",
    ".audit_tmp",
    "scratch",
    "cluster/runtime-snapshot-*",
]

[lint]
select = [
    "E9",   # syntax / IO errors
    "F63",  # comparisons that are always true or false
    "F7",   # break/return outside a loop or function
    "F82",  # undefined name
    "F401", # imported but unused
]
