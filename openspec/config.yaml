schema: spec-driven

project: proyecto-grado-ssl-lesiones
engram_project: sslsantander

context: |
  Thesis research repo (UNAB, Ing. de Sistemas): skin lesion classification with
  self-supervised learning (SimSiam/DINO, ResNet-50/ViT backbones). Pure
  Python 3.11-3.13, no framework, no pyproject.toml — deps split into
  requirements-dev.txt (numpy/pandas/scikit-learn/pytest/ruff, CPU-only) and
  requirements-pretrain.txt (torch/torchvision/mlflow, GPU-only). Kaggle
  notebooks are generated by injecting src/ code inline via scripts/build_*.py
  builders (never import the package directly). docs/NN-tema.md numbered
  sequentially. Bilingual: code/docstrings in English, docs and some
  domain-facing strings (gate labels, thesis prose) in Spanish.

  The active branch is feature/fitzpatrick-domain-adaptation-pr4-circle-stage2,
  based on origin/feature/v6-gpu-ssl-pretraining, and contains src/dermssl/,
  tests/, CI, notebooks, docs, and the Fitzpatrick/CIRCLe Stage 2 changes.
  The sibling PR branches remain available for comparison; do not assume the
  active checkout is identical to main. Data, checkpoints, and GPU outputs are
  external or ignored by Git.

strict_tdd: true

testing:
  test_runner: pytest
  test_command: "CI_REQUIRE_FULL_DEPS=1 pytest -q -rs --strict-markers"
  lint_command: "ruff check"
  ci: .github/workflows/ci.yml (on origin/feature/v6-gpu-ssl-pretraining only)
  local_environment: "Python 3.14.4 detected; pytest and ruff executables unavailable"
  notes: |
    Full suite (28 test files, no pyproject/pytest.ini — conftest.py inserts
    src/ onto sys.path) runs CPU-only. GPU-only modules
    (src/dermssl/pretrain/torch_*.py, scripts/pretrain.py) are validated via
    py_compile/ast-level tests (tests/test_pretrain_torch_layer.py), never
    executed locally — real GPU execution happens on Kaggle/cluster only.
    requirements-dev.txt explicitly warns: running bare `pytest` without
    CI_REQUIRE_FULL_DEPS=1 lets tests/test_probes.py and
    tests/test_notebook_metrics_binary.py silently skip via missing
    scikit-learn and still report green. Strict TDD MUST always use the env
    var, never bare pytest.

rules:
  proposal:
    - Include rollback plan for risky changes
    - State explicitly which branch (main vs origin/feature/v6-gpu-ssl-pretraining)
      the change assumes as its base, given the branch/main divergence risk
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale (matches existing style:
      see src/dermssl/gates.py module docstring for the expected tone)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Tasks touching src/dermssl/pretrain/torch_*.py or scripts/pretrain.py
      MUST separate "compile/static test" tasks (CPU, always runnable) from
      "GPU execution" tasks (Kaggle/cluster only, out of automated CI)
  apply:
    - Follow existing code patterns (dataclasses, type hints, `from __future__
      import annotations`, docstrings explain WHY not just WHAT)
    tdd: true
    test_command: "CI_REQUIRE_FULL_DEPS=1 pytest -q -rs --strict-markers"
  verify:
    test_command: "CI_REQUIRE_FULL_DEPS=1 pytest -q -rs --strict-markers"
    build_command: "ruff check"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
